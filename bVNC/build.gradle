apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion compileApi

    namespace 'com.undatech.remoteClientUi'

    flavorDimensions "channel"

    defaultConfig {
        targetSdkVersion targetApi
        minSdkVersion project.getProperties().get("SDK_VERSION")
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        buildConfig true
    }

    namespace 'com.qihua.bVNC'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        // app module also needs jniDebuggable=true so AS launches
        // lldb-server correctly when Debug is selected. Mirrors
        // remoteClientLib/jni/libs/deps/FreeRDP/.../freeRDPCore/
        // build.gradle (line 19-22).
        debug {
            jniDebuggable true
        }
    }

    productFlavors {
        gplay {
            dimension "channel"
            buildConfigField "boolean", "EDGE_ENABLED", "true"
        }

        free {
            dimension "channel"
            buildConfigField "boolean", "EDGE_ENABLED", "false"
        }
    }

    packagingOptions {
        exclude 'lib/armeabi/libsqlcipher.so'
        exclude 'lib/mips64/libsqlcipher.so'
        exclude 'lib/mips/libsqlcipher.so'
    }

    useLibrary 'org.apache.http.legacy'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation fileTree(include:['*.jar'], dir:'libs')

    implementation project(':remoteClientLib')
    implementation project(':pubkeyGenerator')
    implementation project(':common')

    implementation project(':remoteClientLib:jni:libs:deps:FreeRDP:client:Android:Studio:freeRDPCore')
    implementation project(':remoteClientLib:jni:libs:deps:moonlight-android:app')

    implementation files('libs/com.antlersoft.android.contentxml.jar')
    implementation files('libs/com.antlersoft.android.db.jar')
    // SSH 终端依赖:connectbot 维护的 trilead-ssh2 fork,包名仍是 com.trilead.ssh2.*。
    // pubkeyGenerator 已经 'api' 它,这里 bVNC 也直接 import trilead 类,需要显式 api 拉过来。
    api 'org.connectbot:sshlib:2.2.20'
    // Current version of bVNC is built with bouncycastle with DH anon ciphers enabled. See https://github.com/qihua/bc-java
    //implementation files("libs/bctls-jdk18on-1.70.jar")
    implementation group: 'org.bouncycastle', name: 'bctls-jdk15on', version: '1.70'
    implementation group: 'androidx.appcompat', name: 'appcompat', version: '1.6.1'
    implementation group: 'androidx.legacy', name: 'legacy-support-v4', version: '1.0.0'
    implementation group: 'androidx.vectordrawable', name: 'vectordrawable', version: '1.1.0'
    implementation group: 'androidx.preference', name: 'preference-ktx', version: '1.2.0'
    implementation(name: 'android-database-sqlcipher-4.5.3', ext: 'aar')
    implementation "androidx.sqlite:sqlite-ktx:2.2.0"
    implementation group: 'org.yaml', name: 'snakeyaml', version: '1.23'
    implementation 'org.apache.httpcomponents:httpcore:4.4.10'
    implementation "com.github.luben:zstd-jni:1.4.3-1@aar"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

//    implementation 'com.google.android.play:review:2.0.1'
//    implementation 'com.google.android.play:review-ktx:2.0.1'
//
//    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation 'com.alibaba:fastjson:2.0.56'
    implementation "com.google.android.material:material:1.11.0"
    implementation 'androidx.cardview:cardview:1.0.0'

    // 友盟统计SDK
//    implementation  'com.umeng.umsdk:common:9.4.7'// 必选
//    implementation  'com.umeng.umsdk:asms:1.4.0'
}
repositories {
    google()
    mavenCentral()
    flatDir {
        dirs '/home/sefler/remote-desktop-clients/remoteClientLib'
    }
}
