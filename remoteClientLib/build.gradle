apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        jcenter()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
    }
}

allprojects {
    repositories {
        jcenter()
        google()
    }
}

android {
    compileSdkVersion compileApi

    namespace 'com.undatech.remoteClientLib'

    defaultConfig {
        targetSdkVersion targetApi
        minSdkVersion project.getProperties().get("SDK_VERSION")
        ndk.abiFilters 'arm64-v8a'
        multiDexEnabled true
    }

    namespace 'com.undatech.remoteClientLib'

    useLibrary 'org.apache.http.legacy'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        // jniDebuggable=true: required so Android Studio's Debugger
        // launches lldb-server against libvterm.so + libvterm_jni.so.
        // Without this, "Debug" hangs on "Loading debugger…" then
        // crashes (NDK 27 lldb-server attach failure). Mirrors
        // remoteClientLib/jni/libs/deps/FreeRDP/.../freeRDPCore/
        // build.gradle (line 19-22).
        debug {
            jniDebuggable true
            renderscriptDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets.main {
        java.srcDirs += 'src/main/java'
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    implementation project(':remoteClientLib:jni:libs:deps:FreeRDP:client:Android:Studio:freeRDPCore')
    implementation project(":remoteClientLib:jni:libs:deps:moonlight-android:app")

    api 'com.android.support:multidex:1.0.3'
    implementation 'org.apache.httpcomponents:httpcore:4.4.10'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation group: 'commons-validator', name: 'commons-validator', version: '1.7'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // SSH terminal state machine: libvterm, exposed to Java via the
    // JNI bridge at jni/src/vterm_jni.c. The .so files (libvterm.so,
    // libvterm_jni.so) are pre-built by build-deps.sh's build_vterm()
    // into src/main/jniLibs/arm64-v8a/. AGP packages those
    // automatically — no externalNativeBuild block declared here
    // (otherwise AS would re-trigger ndk-build every APK build).
}