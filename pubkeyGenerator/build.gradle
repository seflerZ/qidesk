apply plugin: 'com.android.library'

android {
    compileSdkVersion compileApi

    namespace 'com.qihua.pubkeygenerator'

    defaultConfig {
        minSdkVersion 8
        targetSdkVersion targetApi
    }

    namespace 'com.qihua.pubkeygenerator'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gradle:osdetector-gradle-plugin:1.4.0'
    }
}

// Use the osdetector-gradle-plugin
apply plugin: "com.google.osdetector"

dependencies {
    // AppCompat is needed so GeneratePubkeyActivity can extend
    // AppCompatActivity — without that, Theme.AppCompat.DayNight (the
    // parent of @style/QiHua) can't propagate night-mode resource
    // switching to this activity, so it stays light-themed regardless
    // of the user's day/night preference. Mirrors the version bVNC pulls.
    implementation 'androidx.appcompat:appcompat:1.6.1'

    api 'org.connectbot:sshlib:2.2.20'
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.70'
    implementation group: 'org.bouncycastle', name: 'bcpkix-jdk15on', version: '1.70'
    api 'net.vrallev.ecc:ecc-25519-java:1.0.3'
    api 'io.moatwel.crypto:eddsa:0.8.1'
    api group: 'net.i2p.crypto', name: 'eddsa', version: '0.3.0'
    implementation project(':common')
}
