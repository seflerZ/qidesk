// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
        flatDir {
            dirs '/home/sefler/remote-desktop-clients/remoteClientLib'
        }
    }
}

ext {
    toolsVersion = properties.get('TOOLS_VERSION', '36.0.0')
    compileApi = properties.get('COMPILE_API', 36)
    targetApi = properties.get('TARGET_API', 36)
    minApi = properties.get('MIN_API', 26)
}
